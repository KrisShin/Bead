name: release-windows

# Windows 安装包发布流水线（本仓库现在只发 Windows）：Release 发布后构建 NSIS 安装器，
# 连同 SHA256SUMS 一起挂到同一个 Release。
#
# 触发：
#   - release: published —— 主路径。`gh release create <tag>` 或网页上建 Release 都会触发
#     （workflow 文件必须存在于默认分支 main 上，否则该事件不生效）。
#   - workflow_dispatch —— 手动试跑，必须填一个已存在的 Release tag，产物挂到该 Release。
#
# 产物：只上传 tauri.conf.json `bundle.targets` 里 Windows 可用的 `nsis`
# （Bead_<version>_x64-setup.exe）。dmg/app/deb/appimage 是 macOS/Linux 目标，Windows runner 不产出；
# 配置里没有 zip bundle，因此不凭空生成便携 zip。
# 校验和：原 release.yml 的 checksums job 随多平台流水线一起删除，这里就地生成同名 SHA256SUMS。
# 红线：无签名步骤、无签名 secrets 分支、不做单文件 exe、不用 UPX。
#
# 发布链路：windows（构建 + 上传 GitHub Release）→ sync-gitee（把同一批产物镜像到 Gitee release，
# 并清掉旧版本附件，Gitee 上只留最新版可下载）。
# Gitee 侧只做镜像，不重复构建：两个平台的安装包必须字节一致，否则 SHA256SUMS 对不上。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传产物的 Release tag（必须已存在，例如 v0.1.0）"
        required: true

# 上传 Release 资产需要写权限；GITHUB_TOKEN 由本 workflow 声明后再使用。
permissions:
  contents: write

# 同一 tag 的发布构建串行执行；手动重跑时不取消已开始的构建，避免半截上传。
concurrency:
  group: release-windows-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: windows nsis
    # 只对软件版本 Release（tag 形如 v*）构建；ocr-v* 等资源发布不触发，
    # 避免给模型资产白跑一次安装包构建。手动触发不受此限制。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      # release 事件默认 checkout 触发它的 tag；手动触发时显式 checkout 填写的 tag。
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # 先确认 Release 真实存在，避免后续把产物传到一个不存在的 tag（也避免误建新 Release）。
      - name: Verify release exists
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view $env:TAG --repo $env:GITHUB_REPOSITORY | Out-Null

      # 前端是原生 JS（frontendDist 直接指向 ../web），没有打包步骤；装依赖只为拿到 @tauri-apps/cli。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Windows runner 自带 WebView2 Runtime；构建不需要它，运行安装后的应用才需要。
      # 仓库根就是 workspace 根，默认缓存 . 下的 Cargo.lock 与 target/，NSIS 工具链由 tauri-bundler 自行下载。
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-nsis

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      # 不指定 --bundles：由 tauri.conf.json 的 bundle.targets 决定，Windows 上只会产出 nsis 安装器
      # 与裸 exe（target/release/bead.exe，目录形态便携可用）。
      - name: Build (tauri build)
        run: npx tauri build

      - name: Upload installer and checksums to release
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仓库根是 cargo workspace（members 含 src-tauri），产物落在 <根>/target，不是 src-tauri/target。
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "target" }
          $bundleDir = Join-Path $targetDir "release/bundle/nsis"
          $assets = @(Get-ChildItem -Path $bundleDir -Filter *.exe -File)
          if ($assets.Count -eq 0) { throw "未找到 NSIS 安装器：$bundleDir" }
          $assets | ForEach-Object {
            Write-Host ($_.Name + " (" + [math]::Round($_.Length / 1MB, 1) + " MB)")
          }

          # sha256sum 兼容格式：小写哈希 + 两个空格 + 文件名；ASCII 编码避免 BOM。
          $lines = $assets | ForEach-Object {
            (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLower() + "  " + $_.Name
          }
          $lines | Out-File -FilePath "SHA256SUMS" -Encoding ascii
          Get-Content -Path "SHA256SUMS" | Write-Host

          gh release upload $env:TAG $assets.FullName SHA256SUMS --clobber --repo $env:GITHUB_REPOSITORY

  # 把 GitHub Release 的同一批产物镜像到 Gitee（gitee.com/KrisShin/Bead）。
  # 独立成 job 的理由：产物以 GitHub Release 为唯一真源，这里只做搬运，不重复构建；
  # 同步失败不会牵连同一次构建的产物，重跑本 job 即可（脚本按「文件名 + 字节数」幂等）。
  # 前置条件：仓库 Secrets 里必须有 GITEE_TOKEN（Gitee 私人令牌，勾 projects 权限）；
  # 缺 token 时本 job 会红，而不是静默跳过——「Gitee 没同步上」必须可见。
  sync-gitee:
    name: gitee release mirror
    needs: windows
    # 与构建 job 同一道闸：只镜像软件版本（v*）；ocr-v* 是模型资源发布，不在这里搬运。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    # 镜像只读 GitHub：不需要、也不该拿写权限。
    permissions:
      contents: read
    steps:
      # 脚本不是发布产物：checkout 默认分支而不是 tag，脚本修好后可直接重跑，不必为改一行脚本再打版本。
      # fetch-depth: 0 —— 同步前要把 tag 推到 Gitee，浅克隆缺少历史对象推不动。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror the release to Gitee
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # -PruneOld：同步完清掉旧版本附件，Gitee 上始终只有最新版可下载——
          # 用户拿着旧版报 bug 的成本比「旧链接失效」更高。清理前的闸门由脚本自己把（见 Invoke-PruneOldReleases）。
          ./scripts/sync-gitee-release.ps1 `
            -Tag $env:TAG `
            -PruneOld `
            -GiteeToken $env:GITEE_TOKEN `
            -GitHubToken $env:GH_TOKEN

