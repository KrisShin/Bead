name: release

# 工单 10：tag 触发四平台构建并上传 Release。
# 红线：无签名步骤、无签名 secrets、无公证脚本；不做单文件 exe、不用 UPX；
# 便携包为目录形态。SHA256SUMS 由 checksums job 生成并附加。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # NSIS 安装器 + zip 目录形态
          - platform: macos-latest # dmg + .app zip（aarch64）
          - platform: ubuntu-latest # deb + AppImage + tar.gz
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install --no-audit --no-fund
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Bead ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin' || '' }}

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm nodejs npm rust webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - name: Build binary
        run: cargo build --release -p bead
      - name: Stage portable directory
        run: |
          mkdir -p dist/bead/usr/bin dist/bead/usr/share/applications
          cp target/release/bead dist/bead/usr/bin/bead
          cp packaging/arch/bead.desktop dist/bead/usr/share/applications/bead.desktop
          tar -C dist/bead -czf "bead-${{ github.ref_name }}-arch-x86_64.tar.gz" .
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "bead-${{ github.ref_name }}-arch-x86_64.tar.gz" --clobber
        # gh 在容器内需要 GH_TOKEN 与 repo 信息
        if: always()

  checksums:
    needs: [build, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all release assets and generate SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}"
          sha256sum * > SHA256SUMS
          grep -v "SHA256SUMS" SHA256SUMS > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber
