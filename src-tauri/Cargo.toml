[package]
name = "bead"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bead-core = { path = "../bead-core" }
bead-providers = { path = "../bead-providers" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
