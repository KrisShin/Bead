[package]
name = "bead"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bead-core = { path = "../bead-core" }
bead-providers = { path = "../bead-providers" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 复用 Tauri 已传递的 windows 0.62.2（Cargo.lock 已锁定），只按需打开 feature，
# 不新增额外编译单元。用途：UIA 选区读取（Win32_UI_Accessibility）、Raw Input
# 鼠标监听（Win32_UI_Input + Win32_UI_WindowsAndMessaging）、剪贴板模拟取词
# （Win32_System_DataExchange + Win32_System_Memory + Win32_UI_Input_KeyboardAndMouse
# + Win32_Globalization）。许可证 MIT OR Apache-2.0。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
