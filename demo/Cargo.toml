[workspace]
# tts-probe 是独立 crate（自带 [workspace]），不参与本探针的构建。
exclude = ["tts-probe"]

[package]
name = "bead-probe"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
